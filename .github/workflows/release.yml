# Build Puppi3's NeewerLux for Windows, macOS and Linux on a release tag push.
# PyInstaller can only build for the OS (and CPU) it runs on, so each OS has its own job.
# A v* tag creates a draft GitHub Release with:
#   - Puppi3sNeewerLux-<version>-Windows.zip            (Puppi3sNeewerLux.exe + light_prefs/)
#   - Puppi3sNeewerLux-<version>-macOS-AppleSilicon.zip (Puppi3sNeewerLux.app, unsigned)
#   - Puppi3sNeewerLux-<version>-Linux-x86_64.tar.gz    (Puppi3sNeewerLux + light_prefs/)
#   - Puppi3sNeewerLux-<version>-Source.zip             (the Python source, for any OS)
# Pull requests that touch the build run the three builds too, without making a release.

name: Build Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Puppi3sNeewerLux.spec'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: write  # Needed to create releases

# 3.12, not 3.13: python-rtmidi publishes no 3.13 wheels, so 3.13 would have to compile it.
# The setup-python interpreter is used rather than a uv-managed one, which PyInstaller can't
# always bundle on macOS and Linux.
env:
  PYTHON_VERSION: '3.12'
  UV_PYTHON_PREFERENCE: only-system

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15                # Apple Silicon; macos-latest (macOS 26) often waits for a free machine
            label: macOS-AppleSilicon
          - os: ubuntu-22.04            # an older glibc, so the build runs on most distributions
            label: Linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # --locked asserts uv.lock is already in agreement with pyproject.toml and
      # fails the build otherwise, so a release can never be cut from a stale or
      # uncommitted dependency resolution. (--frozen would only skip updating the
      # lock, which silently installs stale contents instead of failing.)
      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Make the macOS icon
        if: runner.os == 'macOS'
        run: |
          ICONSET=io.github.puppi3_music.Puppi3sNeewerLux.iconset
          mkdir "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size io.github.puppi3_music.Puppi3sNeewerLux.png --out "$ICONSET/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 128 256; do
            cp "$ICONSET/icon_$((size * 2))x$((size * 2)).png" "$ICONSET/icon_${size}x${size}@2x.png"
          done
          rm "$ICONSET/icon_64x64.png"
          iconutil -c icns "$ICONSET"

      - name: Build with PyInstaller
        run: uv run --locked --group build pyinstaller Puppi3sNeewerLux.spec

      # Starts the built program far enough to import every module, print its banner and help, and quit.
      # (Not on Windows: the .exe has no console to print to.)
      - name: Check the build starts
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN=dist/Puppi3sNeewerLux.app/Contents/MacOS/Puppi3sNeewerLux
          else
            sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libportaudio2 > /dev/null
            BIN=dist/Puppi3sNeewerLux/Puppi3sNeewerLux
          fi
          "$BIN" --help | tee help.txt
          grep -q "Puppi3's NeewerLux ver. " help.txt
          grep -q -- "--nanoleaf_pair" help.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "light_prefs" -Destination "dist/Puppi3sNeewerLux/light_prefs" -Recurse
          Copy-Item -Path "README.md", "CHANGELOG.md" -Destination "dist/Puppi3sNeewerLux/"
          Compress-Archive -Path "dist/Puppi3sNeewerLux/*" -DestinationPath "Puppi3sNeewerLux-$env:VERSION-${{ matrix.label }}.zip"

      # ditto keeps the app bundle's symlinks and permissions, which a plain zip can lose
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Puppi3sNeewerLux.app "Puppi3sNeewerLux-$VERSION-${{ matrix.label }}.zip"

      # tar keeps the program's executable bit, which the artifact upload's own zip would drop
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp -R light_prefs dist/Puppi3sNeewerLux/light_prefs
          cp README.md CHANGELOG.md dist/Puppi3sNeewerLux/
          tar -czf "Puppi3sNeewerLux-$VERSION-${{ matrix.label }}.tar.gz" -C dist Puppi3sNeewerLux

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: |
            Puppi3sNeewerLux-*.zip
            Puppi3sNeewerLux-*.tar.gz
          if-no-files-found: error

  build-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          zip -r "Puppi3sNeewerLux-${VERSION}-Source.zip" \
            Puppi3sNeewerLux.py \
            puppi3s_neewerlux_ui.py \
            puppi3s_neewerlux_theme.py \
            puppi3s_neewerlux_webui.py \
            puppi3s_neewerlux_anim_editor.py \
            puppi3s_neewerlux_audio.py \
            puppi3s_neewerlux_midi.py \
            puppi3s_neewerlux_nanoleaf.py \
            Puppi3sNeewerLux.bat \
            Puppi3sNeewerLux-HTTP.bat \
            pyproject.toml \
            uv.lock \
            io.github.puppi3_music.Puppi3sNeewerLux.desktop \
            io.github.puppi3_music.Puppi3sNeewerLux.ico \
            io.github.puppi3_music.Puppi3sNeewerLux.png \
            README.md \
            CHANGELOG.md \
            LICENSE \
            LICENSE-MIT \
            light_prefs/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: Puppi3sNeewerLux-*-Source.zip

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            Puppi3sNeewerLux-*.zip
            Puppi3sNeewerLux-*.tar.gz
