# Build the Puppi3Lux Windows EXE on release tag push
# Creates a GitHub Release with:
#   - Puppi3Lux-<version>-Windows.zip  (PyInstaller --onedir EXE + light_prefs/)
#   - Puppi3Lux-<version>-Source.zip   (Python source distribution)

name: Build Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write  # Needed to create releases

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: '3.13'
          enable-cache: true

      # --locked asserts uv.lock is already in agreement with pyproject.toml and
      # fails the build otherwise, so a release can never be cut from a stale or
      # uncommitted dependency resolution. (--frozen would only skip updating the
      # lock, which silently installs stale contents instead of failing.)
      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Build EXE with PyInstaller
        run: uv run --locked --group build pyinstaller Puppi3Lux.spec

      - name: Copy light_prefs into dist
        run: |
          Copy-Item -Path "light_prefs" -Destination "dist/Puppi3Lux/light_prefs" -Recurse
          Copy-Item -Path "README.md" -Destination "dist/Puppi3Lux/"
          Copy-Item -Path "CHANGELOG.md" -Destination "dist/Puppi3Lux/"

      - name: Create EXE zip
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path "dist/Puppi3Lux/*" -DestinationPath "Puppi3Lux-${version}-Windows.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Puppi3Lux-*-Windows.zip

  build-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "Puppi3Lux-${VERSION}-Source.zip" \
            Puppi3Lux.py \
            puppi3lux_ui.py \
            puppi3lux_theme.py \
            puppi3lux_webui.py \
            puppi3lux_anim_editor.py \
            puppi3lux_audio.py \
            puppi3lux_midi.py \
            puppi3lux_nanoleaf.py \
            Puppi3Lux.bat \
            Puppi3Lux-HTTP.bat \
            pyproject.toml \
            uv.lock \
            io.github.puppi3_music.Puppi3Lux.desktop \
            io.github.puppi3_music.Puppi3Lux.ico \
            io.github.puppi3_music.Puppi3Lux.png \
            README.md \
            CHANGELOG.md \
            light_prefs/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: Puppi3Lux-*-Source.zip

  create-release:
    needs: [build-windows-exe, build-source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            Puppi3Lux-*-Windows.zip
            Puppi3Lux-*-Source.zip
