# Run the test suite on every pull request and on every push to main.
# No Bluetooth adapter or real lights are needed: the Nanoleaf tests use the fake
# controller in tests/fake_nanoleaf.py, and the dialog test runs Qt offscreen.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # On all three OSes the release is built for. The tests use 127.0.0.1-only sockets,
    # so there is no firewall prompt to worry about.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: '3.13'
          enable-cache: true

      # bleak and PySide6 only: the audio group (python-rtmidi, sounddevice) is not needed
      # by any test. --locked fails if uv.lock is out of date with pyproject.toml.
      # Qt's offscreen platform still loads the GL and keyboard libraries
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group gui

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: uv run --no-sync python -m unittest discover -s tests -p "test_*.py" -v
